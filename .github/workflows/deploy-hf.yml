name: Sync backend to Hugging Face

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  HF_SPACE_ID: q1est/school-journal-api

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Hugging Face token
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: test -n "$HF_TOKEN"

      - name: Create Space if it does not exist
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          set -euo pipefail
          payload='{"name":"school-journal-api","organization":"q1est","type":"space","sdk":"docker","visibility":"public"}'
          status="$(curl --silent --show-error --output /tmp/hf-create.json --write-out '%{http_code}' \
            --request POST 'https://huggingface.co/api/repos/create' \
            --header "Authorization: Bearer ${HF_TOKEN}" \
            --header 'Content-Type: application/json' \
            --data "$payload")"
          if [[ "$status" != "200" && "$status" != "201" && "$status" != "409" ]]; then
            cat /tmp/hf-create.json
            exit 1
          fi

      - name: Set Space CORS origin
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error \
            --request POST 'https://huggingface.co/api/spaces/q1est/school-journal-api/variables' \
            --header "Authorization: Bearer ${HF_TOKEN}" \
            --header 'Content-Type: application/json' \
            --data '{"key":"ALLOWED_ORIGINS","value":"https://q1est.github.io"}'

      - name: Prepare Space repository
        run: |
          set -euo pipefail
          mkdir -p /tmp/hf-space
          git archive --format=tar HEAD | tar -x -C /tmp/hf-space
          cp deploy/huggingface/README.md /tmp/hf-space/README.md
          rm -rf /tmp/hf-space/.git
          cd /tmp/hf-space
          git init -b main
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add --all
          git commit -m "Sync backend from GitHub"

      - name: Push Space repository
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          set -euo pipefail
          cd /tmp/hf-space
          git -c http.extraheader="AUTHORIZATION: bearer ${HF_TOKEN}" \
            push --force 'https://huggingface.co/spaces/q1est/school-journal-api' HEAD:main
