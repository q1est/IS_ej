name: Sync backend to Netrun

on:
  workflow_run:
    workflows: [Go CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read

jobs:
  deploy:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Skip stale successful runs
        id: freshness
        env:
          DEPLOY_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          git fetch origin main --depth=1
          if [[ "$(git rev-parse FETCH_HEAD)" == "$DEPLOY_SHA" ]]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "current=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping deploy for a commit that is no longer at the tip of main."
          fi

      - name: Check Netrun configuration
        id: config
        if: steps.freshness.outputs.current == 'true'
        env:
          NETRUN_API_KEY: ${{ secrets.NETRUN_API_KEY }}
          NETRUN_PROJECT_ID: ${{ secrets.NETRUN_PROJECT_ID }}
        run: |
          if [[ -z "$NETRUN_API_KEY" || -z "$NETRUN_PROJECT_ID" ]]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Add NETRUN_API_KEY and NETRUN_PROJECT_ID to enable backend sync."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create source archive
        if: steps.freshness.outputs.current == 'true' && steps.config.outputs.configured == 'true'
        run: git archive --format=zip --output=/tmp/school-journal.zip HEAD

      - name: Upload backend to Netrun
        if: steps.freshness.outputs.current == 'true' && steps.config.outputs.configured == 'true'
        env:
          NETRUN_API_KEY: ${{ secrets.NETRUN_API_KEY }}
          NETRUN_PROJECT_ID: ${{ secrets.NETRUN_PROJECT_ID }}
        run: node scripts/netrun-deploy.mjs /tmp/school-journal.zip
