name: Deploy frontend to GitHub Pages

on:
  workflow_run:
    workflows: [Go CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Skip stale successful runs
        id: freshness
        env:
          DEPLOY_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          git fetch origin main --depth=1
          if [[ "$(git rev-parse FETCH_HEAD)" == "$DEPLOY_SHA" ]]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "current=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping deploy for a commit that is no longer at the tip of main."
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v5
        if: steps.freshness.outputs.current == 'true'

      - name: Inject Netrun API URL
        if: steps.freshness.outputs.current == 'true'
        env:
          NETRUN_API_URL: ${{ vars.NETRUN_API_URL || secrets.NETRUN_API_URL }}
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const url = (process.env.NETRUN_API_URL || '').trim();
          if (url && !/^https:\/\//.test(url)) {
            throw new Error('NETRUN_API_URL must be an HTTPS URL');
          }
          fs.writeFileSync('web/config.js', `window.APP_CONFIG = ${JSON.stringify({ API_BASE_URL: url })};\n`);
          if (!url) console.warn('NETRUN_API_URL is not set; the published frontend will show the API configuration error.');
          NODE

      - name: Upload frontend artifact
        uses: actions/upload-pages-artifact@v3
        if: steps.freshness.outputs.current == 'true'
        with:
          path: ./web

      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v4
        if: steps.freshness.outputs.current == 'true'
